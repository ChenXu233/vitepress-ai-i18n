name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC trusted publishing 必需：允许 Actions 签发 id-token
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing 要求 Node ≥ 22.14.0（带 npm ≥ 11.5.1）
          node-version: '24'
          cache: 'pnpm'
          # 不设 registry-url：那会让 setup-node 生成引用 ${NODE_AUTH_TOKEN}
          # 的 .npmrc，而 OIDC 发布不使用该变量，反而干扰凭据协商。
          # release 构建禁用缓存（官方建议）
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Diagnostics
        run: |
          echo "node: $(node -v)"
          echo "npm : $(npm -v)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- effective .npmrc ---"; cat "$NPM_CONFIG_USERCONFIG"
          else
            echo "(no userconfig file)"
          fi
          echo "--- OIDC env ---"
          env | grep -i 'ACTIONS_ID_TOKEN' | sed 's/=.*/=<set>/' || echo "(none)"
          echo "NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:-<unset>}"

      - run: pnpm test

      - run: pnpm build

      # 用 npm 而非 pnpm 发布：OIDC 实现在 npm CLI 内，pnpm publish 不支持
      #
      # 先剥掉 .npmrc 里的 _authToken：setup-node/pnpm 会留下
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`，而 NODE_AUTH_TOKEN
      # 未设时它展开为空。npm CLI 见到该行即认为「已配置认证」，
      # 于是短路 OIDC 流程直接凭空凭据失败（ENEEDAUTH/E404）。
      # 删掉此行后 npm 才会检测 ACTIONS_ID_TOKEN_REQUEST_* 并发起 OIDC 交换。
      # 参考：actions/setup-node#1551、npm/documentation#1960
      - name: Strip _authToken so OIDC takes over
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "userconfig: $NPM_CONFIG_USERCONFIG"
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "--- .npmrc after strip ---"; cat "$NPM_CONFIG_USERCONFIG"
          else
            echo "(no userconfig to strip)"
          fi
          rm -f "$HOME/.npmrc" 2>/dev/null || true

      # env -u：必须让 NODE_AUTH_TOKEN 彻底不存在。空字符串也会被 npm 视为
      # 「已配置认证」（见 Kuonirad/MCOP-Framework-2.0#561→#564 的排查链）。
      - run: env -u NODE_AUTH_TOKEN npm publish --access public
